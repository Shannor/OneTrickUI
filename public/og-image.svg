<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">One Trick — Destiny 2 PvP Performance Tracker</title>
  <desc id="desc">Open Graph share banner for One Trick Destiny 2 tracker</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="glow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="orangeText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Tactical Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- Main Content Container -->
  <g transform="translate(100, 120)">
    
    <!-- Logo Mark -->
    <g transform="translate(0, 0) scale(1.6)">
      <!-- Outer Shape (White) -->
      <path fill="#ffffff" d="M86.26,31.28c-1.24-1.75-2.94-3.22-4.91-4.44L81.05,26.65c-10-6.17-22.56-6.89-22.56-6.89s-14.48-1.49-28,0.21c4.29-0.39,17.82-0.32,31.1,13.73c15.68,16.6-0.27,26.58-10.91,24.78c13.51,2.61,28.59,1.56,35.48-12.13c3.12-6.22,2.74-10.95,0.45-14.55c3.68,3.93,4.99,9.48,1.11,17.23c-12.38,24.73-50.28,9.88-61.03,4.13S4.29,34.75,13.58,26.71c1.16-1,2.73-1.84,4.59-2.54c-3.93,1.37-7.24,3.27-9.36,5.85c-10.47,12.78,2.65,31.29,14.76,40.43c12.11,9.13,54.82,32.73,68.78-6.57C98.15,47.58,93.62,37.5,86.26,31.28z"/>
      <!-- Inner Flame (Primary Orange) -->
      <path fill="#f97316" d="M23.66,48.45c-0.39-0.59-1.61-3.06,2.03-6.92c4.11-4.34,14.4-9.13,26.76-7.92c0,0,5.07,0.34,7.35,3.18c-0.42-0.57-0.89-1.15-1.39-1.74C46.64,21.18,34.64,21.11,30.83,21.5c-0.41,0.05-0.82,0.11-1.24,0.18c-3.14,0.5-6.19,1.23-8.9,2.28c-1.58,0.66-2.93,1.45-3.93,2.41C10.04,32.81,16.08,42.36,23.66,48.45z"/>
    </g>

    <!-- Title & Brand Text -->
    <g transform="translate(180, 55)">
      <text font-family="Inter, system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="2">
        <tspan fill="#f97316">1</tspan>
        <tspan fill="#ffffff"> TRICK</tspan>
      </text>
      <text y="48" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" letter-spacing="4">
        DESTINY 2 PvP PERFORMANCE TRACKER
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1" width="800">
      Track live active sessions, analyze loadouts, and uncover deep PvP insights.
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 290)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="260" height="52" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="28" cy="26" r="6" fill="#f97316"/>
        <text x="46" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
          ACTIVE FEEDS
        </text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(280, 0)">
        <rect width="310" height="52" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="28" cy="26" r="6" fill="#38bdf8"/>
        <text x="46" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
          LOADOUT ANALYTICS
        </text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(610, 0)">
        <rect width="280" height="52" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
        <circle cx="28" cy="26" r="6" fill="#a855f7"/>
        <text x="46" y="33" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
          FIRETEAM TRACKING
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#orangeText)"/>
</svg>
