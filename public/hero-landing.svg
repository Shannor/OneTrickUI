<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One Trick — Hero Background</title>
  <desc id="desc">Sci-fi Destiny 2 background banner for One Trick landing page</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="glowOrange" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="75%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#f8fafc" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background Base & Glows -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowOrange)"/>
  <rect width="1600" height="900" fill="url(#glowGold)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Stylized Geometric Brand Lines -->
  <g opacity="0.15">
    <path d="M -100,200 L 600,950 L 680,950 L -20,200 Z" fill="url(#accentOrange)"/>
    <path d="M 1200,-100 L 1750,750 L 1700,750 L 1150,-100 Z" fill="#38bdf8"/>
  </g>

  <!-- Large Stylized Brand Emblem Silhouette in Background -->
  <g opacity="0.06" transform="translate(950, 100) scale(4.8)">
    <path fill="#ffffff" d="M86.26,31.28c-1.24-1.75-2.94-3.22-4.91-4.44L81.05,26.65c-10-6.17-22.56-6.89-22.56-6.89s-14.48-1.49-28,0.21c4.29-0.39,17.82-0.32,31.1,13.73c15.68,16.6-0.27,26.58-10.91,24.78c13.51,2.61,28.59,1.56,35.48-12.13c3.12-6.22,2.74-10.95,0.45-14.55c3.68,3.93,4.99,9.48,1.11,17.23c-12.38,24.73-50.28,9.88-61.03,4.13S4.29,34.75,13.58,26.71c1.16-1,2.73-1.84,4.59-2.54c-3.93,1.37-7.24,3.27-9.36,5.85c-10.47,12.78,2.65,31.29,14.76,40.43c12.11,9.13,54.82,32.73,68.78-6.57C98.15,47.58,93.62,37.5,86.26,31.28z"/>
    <path fill="#f97316" d="M23.66,48.45c-0.39-0.59-1.61-3.06,2.03-6.92c4.11-4.34,14.4-9.13,26.76-7.92c0,0,5.07,0.34,7.35,3.18c-0.42-0.57-0.89-1.15-1.39-1.74C46.64,21.18,34.64,21.11,30.83,21.5c-0.41,0.05-0.82,0.11-1.24,0.18c-3.14,0.5-6.19,1.23-8.9,2.28c-1.58,0.66-2.93,1.45-3.93,2.41C10.04,32.81,16.08,42.36,23.66,48.45z"/>
  </g>

  <!-- Horizontal Focus Lines -->
  <g stroke="url(#accentOrange)" stroke-opacity="0.2">
    <path d="M0 450 L1600 450"/>
  </g>
</svg>
